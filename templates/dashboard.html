<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>nanoMon Docker Statistics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/themes.css" rel="stylesheet">
</head>

<body class="">

<div class="w-100 mb-3 theme-switch-wrap">
  <div class="d-flex justify-content-end">
    <label for="themeSelect" class="mb-0 text-muted me-2 align-self-center">Theme</label>
    <select id="themeSelect" class="form-select form-select-sm theme-switch" style="max-width: 220px;">
      <option value="default" selected>Default</option>
      <option value="amber">Amber</option>
      <option value="amethyst">Amethyst</option>
      <option value="cobalt">Cobalt</option>
      <option value="ember">Ember</option>
      <option value="emerald">Emerald</option>
      <option value="forest">Forest</option>
      <option value="mint">Mint</option>
      <option value="midnight">Midnight</option>
      <option value="royal">Royal</option>
      <option value="rose-gold">Rose Gold</option>
      <option value="slate">Slate</option>
      <option value="slate-night">Slate Night</option>
      <option value="sunset">Sunset</option>
      <option value="teal-slate">Teal Slate</option>
      <option value="violet">Violet</option>
    </select>
  </div>
</div>

<div class="container-fluid p-4">

    <div class="mb-4">
        <h1 class="display-6">nanoMon Docker Statistics</h1>
        <p class="text-muted">
            Last Updated: <span id="last-updated">Loading...</span>
        </p>
    </div>

    <div id="summary-cards" class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title">Containers</h5>
                    <h2 id="total-containers" class="display-5">-</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title">Running</h5>
                    <h2 id="running-containers" class="display-5">-</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5 class="card-title">Stopped</h5>
                    <h2 id="stopped-containers" class="display-5">-</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-success text-white">
            Running Containers
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">

                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>CPU</th>
                            <th>Memory</th>
                            <th>Restart</th>
                            <th>Uptime</th>
                        </tr>
                    </thead>

                    <tbody id="running-container-table">
                        <tr>
                            <td colspan="6" class="text-center">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
            Stopped Containers
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">

                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Reason</th>
                            <th>Restart</th>
                        </tr>
                    </thead>

                    <tbody id="stopped-container-table">
                        <tr>
                            <td colspan="4" class="text-center">
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

</div>

<script src="/static/nanomon.js"></script>
<script>
  const select = document.getElementById('themeSelect');

  function applyTheme(theme) {
    if (!theme || theme === 'default') {
      document.documentElement.removeAttribute('data-theme');
      localStorage.removeItem('theme');
      return;
    }
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }

  select?.addEventListener('change', () => applyTheme(select.value));

  // Load saved theme (if any)
  const saved = localStorage.getItem('theme');
  if (saved) {
    select.value = saved;
    applyTheme(saved);
  }
</script>
</body>
</html>
